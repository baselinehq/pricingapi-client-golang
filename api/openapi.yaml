      description: "The query parameters you can filter this kind of price by. They\
        \ differ by kind because the fields that identify a price differ: compute\
        \ prices carry an instance type, disk prices a disk type, database prices\
        \ an engine."
      parameters:
      - description: Price kind
        in: path
        name: kind
        required: true
        schema:
          enum:
          - compute
          - disks
          - databases
          - models
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterSet"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List the filters a price kind accepts
      tags:
      - marketplace
  /v1/marketplace/models:
    get:
      description: |-
        List the model rates your organization has published. Only your own rates are returned, never another organization's.
        Filters combine, and paging is by limit and an opaque cursor carried in the page of the previous response.
      parameters:
      - description: Maximum prices to return (default 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: Cursor from the previous page
        in: query
        name: cursor
        schema:
          type: string
      - description: Filter by model
        in: query
        name: model
        schema:
          type: string
      - description: Filter by model provider
        in: query
        name: provider
        schema:
          type: string
      - description: Filter by region
        in: query
        name: region
        schema:
          type: string
      - description: Filter by token bucket
        in: query
        name: token_bucket
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPricePage"
          description: A page of your prices
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List your model prices
      tags:
      - marketplace
    post:
      description: |-
        Register your own token rates for models you host, so CostGraph can price calls it has no public rate for.
        Entries are versioned: a price change closes the current row and opens a new one, so spend already recorded keeps the rate it was billed at.
        The returned id is what you attach with the `costgraph.ai/pricing-id.model` label or tag. Each version carries its own id, so read the live entry back after a price change.
