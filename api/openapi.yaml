        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComputeRecommendation"
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get recommendations for compute instances
      x-codegen-request-body-name: instance
  /recommendations/compute:
    post:
      deprecated: true
      description: |-
        Get the cheapest compute candidate per provider with savings versus the requested instance
        Superseded by POST /v1/recommendations/compute, which returns RFC 9457 problem responses on failure.
