openapi: 3.0.1
info:
  contact:
    email: support@costgraph.ai
    name: Customer Support
    url: https://costgraph.ai/support
  description: Provides API level access to the Costgraph Services.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://costgraph.ai/terms-of-use
  title: Pricing API
  version: "1.0"
servers:
- url: https://pricing.baselinehq.cloud/
paths:
  /healthz:
    get:
      deprecated: true
      description: |-
        Health check endpoint
        Superseded by GET /v1/healthz.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Health check response
      summary: Health check endpoint
  /marketplace/providers/compute:
    delete:
      deprecated: true
      description: |-
        Delete one of your compute rates by id.
        A rate a resource is already priced against cannot be deleted; the request fails while that link exists, so re-pin those resources first.
        Once it is gone, a resource still carrying its id stops resolving a price rather than falling back to attribute matching.
        Superseded by DELETE /v1/marketplace/compute/{id}, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Instance ID
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredComputePrices"
          description: Pricing response for a custom provider
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Instance not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete a custom provider instance
    get:
      deprecated: true
      description: |-
        List the compute rates your organization has registered. Only your own rates are returned, never another organization's.
        Filters combine, and paging is by limit and offset.
        Superseded by GET /v1/marketplace/compute, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Maximum entries to return (default 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: Entries to skip
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by service
        in: query
        name: service
        schema:
          type: string
      - description: Filter by region
        in: query
        name: region
        schema:
          type: string
      - description: Filter by instance type
        in: query
        name: instance_type
        schema:
          type: string
      - description: Filter by usage type
        in: query
        name: usage_type
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputePriceList"
          description: Pricing response for custom pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid limit or offset
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get your custom pricing entries
    post:
      deprecated: true
      description: |-
        Register your own compute rates so CostGraph can price machines it has no public price for, such as bare metal or a private cloud.
        An entry is upserted on its natural key (provider, service, region, availability zone, usage type, instance type, operating system and period billing hours), so re-posting the same entry with a new cost keeps its id and reprices everything already using it. Changing any key field mints a new id, because it describes a different SKU.
        The returned id is what you attach to a resource with the `costgraph.ai/pricing-id.compute` label or tag. Treat it as a secret you hand out deliberately: anyone holding it can pin to the rate, which is how a provider prices clusters it sells on.
        Superseded by POST /v1/marketplace/compute, which returns RFC 9457 problem responses on failure.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputePricesRequest"
        description: Custom pricing request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredComputePrices"
          description: Pricing response for a custom provider
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Register a custom provider
      x-codegen-request-body-name: instance
  /marketplace/providers/databases:
    delete:
      deprecated: true
      description: |-
        Delete one of your managed database rates by id.
        A rate a database or one of its reports still references cannot be deleted; the request fails while that reference exists, so re-pin first.
        Once it is gone, a database still carrying its id stops resolving a price.
        Superseded by DELETE /v1/marketplace/databases/{id}, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Database pricing ID
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDatabasePrices"
          description: Pricing response for custom database pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Database pricing entry not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete a custom database pricing entry
    get:
      deprecated: true
      description: |-
        List the managed database rates your organization has registered. Only your own rates are returned.
        Filters combine, and paging is by limit and offset.
        Superseded by GET /v1/marketplace/databases, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Maximum entries to return (default 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: Entries to skip
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by service
        in: query
        name: service
        schema:
          type: string
      - description: Filter by region
        in: query
        name: region
        schema:
          type: string
      - description: Filter by engine
        in: query
        name: engine
        schema:
          type: string
      - description: Filter by edition
        in: query
        name: edition
        schema:
          type: string
      - description: Filter by instance type
        in: query
        name: instance_type
        schema:
          type: string
      - description: Filter by usage type
        in: query
        name: usage_type
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasePriceList"
          description: Pricing response for custom database pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid limit or offset
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get your custom database pricing entries
    post:
      deprecated: true
      description: |-
        Register your own managed database rates, keyed by engine, edition, deployment option, storage type and instance type alongside the usual provider, service and region.
        An entry is upserted on the full natural key (provider, service, region, availability zone, usage type, engine, edition, deployment option, billing config, storage type, instance type, architecture and period billing hours), so re-posting with a new cost keeps its id; changing any key field mints a new one.
        The returned id is what you attach with the `costgraph.ai/pricing-id.database` label or tag.
        Superseded by POST /v1/marketplace/databases, which returns RFC 9457 problem responses on failure.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabasePricesRequest"
        description: Custom database pricing request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDatabasePrices"
          description: Pricing response for custom database pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Register custom database pricing
      x-codegen-request-body-name: instance
  /marketplace/providers/disks:
    delete:
      deprecated: true
      description: |-
        Delete one of your storage rates by id.
        A rate a volume is already priced against cannot be deleted; the request fails while that link exists, so re-pin those volumes first.
        Once it is gone, a volume still carrying its id stops resolving a price.
        Superseded by DELETE /v1/marketplace/disks/{id}, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Disk pricing ID
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDiskPrices"
          description: Pricing response for a custom disk provider
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Disk pricing entry not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete a custom disk provider entry
    get:
      deprecated: true
      description: |-
        List the storage rates your organization has registered. Only your own rates are returned.
        Filters combine, and paging is by limit and offset.
        Superseded by GET /v1/marketplace/disks, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Maximum entries to return (default 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: Entries to skip
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by service
        in: query
        name: service
        schema:
          type: string
      - description: Filter by region
        in: query
        name: region
        schema:
          type: string
      - description: Filter by disk type
        in: query
        name: type
        schema:
          type: string
      - description: Filter by usage type
        in: query
        name: usage_type
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskPriceList"
          description: Pricing response for custom disk pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid limit or offset
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get your custom disk pricing entries
    post:
      deprecated: true
      description: |-
        Register your own storage rates, priced per GB hour with optional IOPS and throughput components and the capacity band they apply to.
        An entry is upserted on its natural key (provider, service, region, availability zone, disk type, usage type and period billing hours), so re-posting with a new cost keeps its id; changing a key field mints a new one.
        Capacity, IOPS and throughput bands are not part of that key, so a second band for the same disk type replaces the first: give each band its own usage type.
        The returned id is what you attach with the `costgraph.ai/pricing-id.storage` label or tag.
        Superseded by POST /v1/marketplace/disks, which returns RFC 9457 problem responses on failure.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiskPricesRequest"
        description: Custom disk pricing request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDiskPrices"
          description: Pricing response for a custom disk provider
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Provider and organization do not match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Register a custom disk provider
      x-codegen-request-body-name: instance
  /marketplace/providers/models:
    delete:
      deprecated: true
      description: |-
        Delete one of your model rates by id. The row is closed rather than removed, so spend already priced against it keeps that rate.
        Usage still pinned to it stops resolving a price, so re-pin before deleting.
        Superseded by DELETE /v1/marketplace/models/{id}, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Model pricing ID
        in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredModelPrices"
          description: Pricing response for custom model pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid id
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Host and organization do not match
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Model pricing entry not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete a custom model pricing entry
    get:
      deprecated: true
      description: |-
        List the live version of each model rate your organization has registered. Only your own rates are returned.
        Filters combine, and paging is by limit and offset.
        Superseded by GET /v1/marketplace/models, which returns RFC 9457 problem responses on failure.
      parameters:
      - description: Maximum entries to return (default 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: Entries to skip
        in: query
        name: offset
        schema:
          type: integer
      - description: Filter by model
        in: query
        name: model
        schema:
          type: string
      - description: Filter by model provider
        in: query
        name: provider
        schema:
          type: string
      - description: Filter by region
        in: query
        name: region
        schema:
          type: string
      - description: Filter by token bucket
        in: query
        name: token_bucket
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPriceList"
          description: Pricing response for custom model pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid limit or offset
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get your custom model pricing entries
    post:
      deprecated: true
      description: |-
        Register custom token pricing for models you host. Entries are versioned: a price change closes the current row and opens a new one, so historic spend keeps the rate it was billed at.
        The returned id is what you attach with the `costgraph.ai/pricing-id.model` label or tag. Each version carries its own id, so read the live entry back after a price change instead of holding on to an earlier one.
        Superseded by POST /v1/marketplace/models, which returns RFC 9457 problem responses on failure.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPricesRequest"
        description: Custom model pricing request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredModelPrices"
          description: Pricing response for custom model pricing
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Host and organization do not match
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Register custom model pricing
      x-codegen-request-body-name: instance
  /pricing:
    post:
      deprecated: true
      description: |-
        Get pricing for compute instances
